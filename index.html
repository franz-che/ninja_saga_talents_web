<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ninja Saga Talents — Database</title>
    <style>
      :root {
        --bg: #0a0d14;
        --panel: #111622;
        --panel2: #171d2a;
        --line: #293247;
        --text: #edf2f7;
        --muted: #99a5b5;
        --accent: #50c7ff;
        --accent2: #a56eff;
        --good: #55d69a;
        --warn: #ffd166;
        --danger: #ff7d8c;
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 10% 0%, #18213a 0, #0a0d14 35%);
        color: var(--text);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 250px 1fr;
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 22px 18px;
        background: rgba(9, 12, 19, 0.9);
        border-right: 1px solid var(--line);
        backdrop-filter: blur(16px);
      }
      .brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .brand small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
      }
      .nav {
        margin: 28px 0;
        display: grid;
        gap: 7px;
      }
      .nav button {
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        padding: 11px 12px;
        border-radius: 10px;
        text-align: left;
      }
      .nav button.active,
      .nav button:hover {
        background: var(--panel2);
        border-color: var(--line);
        color: var(--text);
      }
      .side-meta {
        margin-top: auto;
        position: absolute;
        left: 18px;
        right: 18px;
        bottom: 20px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }
      .kbd {
        border: 1px solid var(--line);
        background: #0d121c;
        border-radius: 5px;
        padding: 1px 5px;
        color: #c9d2dd;
      }
      main {
        padding: 26px 30px 48px;
        min-width: 0;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 22px;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        font-weight: 700;
      }
      .title {
        font-size: 32px;
        font-weight: 850;
        margin: 4px 0;
      }
      .subtitle {
        color: var(--muted);
        max-width: 820px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 18px 0;
      }
      .search {
        flex: 1;
        min-width: 260px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #0e131d;
        color: var(--text);
        outline: none;
      }
      .search:focus {
        border-color: #3c99c6;
        box-shadow: 0 0 0 3px rgba(80, 199, 255, 0.08);
      }
      select,
      .ghost,
      .primary {
        padding: 11px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--text);
      }
      .primary {
        background: linear-gradient(135deg, #1a80ad, #694bc0);
        border-color: #4b8eb4;
      }
      .ghost:hover {
        background: var(--panel2);
      }
      .statsbar {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 10px 0 22px;
      }
      .kpi {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.015));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 15px 16px;
      }
      .kpi b {
        font-size: 22px;
      }
      .kpi span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 14px;
      }
      .card {
        background: linear-gradient(180deg, #131a26, #0f141e);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        transition:
          0.18s transform,
          0.18s border-color,
          0.18s box-shadow;
      }
      .card:hover {
        transform: translateY(-2px);
        border-color: #40506e;
        box-shadow: var(--shadow);
      }
      .thumb {
        height: 150px;
        background: #090c12;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .card-body {
        padding: 14px;
      }
      .name-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: start;
      }
      .name {
        font-weight: 800;
        font-size: 16px;
      }
      .badge {
        font-size: 10px;
        padding: 4px 7px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .badge.extreme {
        color: #8cd7ff;
        border-color: #225575;
        background: #0e2330;
      }
      .badge.secret {
        color: #d7b6ff;
        border-color: #51377a;
        background: #211635;
      }
      .badge.e {
        color: #ffd98c;
        border-color: #765c28;
        background: #2d2412;
      }
      .badge.pvp {
        color: #9ff0c4;
        border-color: #285e48;
        background: #102319;
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .chip {
        font-size: 11px;
        color: #cad4df;
        background: #0d121b;
        border: 1px solid #222c3c;
        padding: 4px 7px;
        border-radius: 7px;
      }
      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .card-actions button {
        flex: 1;
        padding: 9px 10px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: #101722;
        color: var(--text);
      }
      .card-actions button:hover {
        background: #172130;
      }
      .empty {
        padding: 50px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
      }
      .table-wrap {
        overflow: auto;
        max-height: 70vh;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #0e131c;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1100px;
      }
      .data-table th,
      .data-table td {
        padding: 10px 11px;
        border-bottom: 1px solid #202839;
        text-align: left;
        white-space: nowrap;
      }
      .data-table th {
        position: sticky;
        top: 0;
        background: #141b27;
        color: #aeb9c8;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        z-index: 2;
      }
      .data-table td {
        font-size: 12px;
      }
      .data-table tr:hover td {
        background: #121a27;
      }
      .talent-link {
        color: #dce8f6;
        background: none;
        border: 0;
        padding: 0;
        font-weight: 750;
      }
      .num {
        font-variant-numeric: tabular-nums;
        color: #d7e6f6;
      }
      .dash {
        color: #576579;
      }
      .other {
        max-width: 430px;
        white-space: normal !important;
        color: #bac6d4;
        line-height: 1.4;
      }
      .compare-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }
      .compare-grid {
        display: grid;
        grid-template-columns: 240px repeat(4, minmax(170px, 1fr));
        gap: 0;
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: auto;
        background: #0e131c;
      }
      .compare-grid > div {
        padding: 10px 12px;
        border-right: 1px solid #202839;
        border-bottom: 1px solid #202839;
        min-height: 42px;
        font-size: 12px;
      }
      .compare-grid .head {
        background: #141b27;
        font-weight: 800;
      }
      .compare-grid .label {
        color: #9facbd;
        font-weight: 700;
      }
      .compare-cell {
        font-variant-numeric: tabular-nums;
      }
      .compare-cell.has {
        color: #f0f7ff;
      }
      .compare-cell.none {
        color: #465468;
      }
      .drawer {
        position: fixed;
        inset: 0;
        display: none;
        background: rgba(0, 0, 0, 0.62);
        z-index: 20;
      }
      .drawer.open {
        display: block;
      }
      .panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        width: min(720px, 96vw);
        background: #0c111a;
        border-left: 1px solid var(--line);
        box-shadow: -30px 0 80px rgba(0, 0, 0, 0.45);
        overflow: auto;
      }
      .panel-top {
        position: sticky;
        top: 0;
        z-index: 3;
        background: rgba(12, 17, 26, 0.95);
        backdrop-filter: blur(12px);
        padding: 18px 20px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .close {
        border: 1px solid var(--line);
        background: #131a25;
        color: var(--text);
        width: 36px;
        height: 36px;
        border-radius: 9px;
      }
      .panel-body {
        padding: 20px;
      }
      .hero-title {
        font-size: 27px;
        font-weight: 850;
        margin: 0 0 6px;
      }
      .hero-meta {
        color: var(--muted);
        font-size: 13px;
      }
      .detail-stats {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        margin: 18px 0;
      }
      .stat-item {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #101722;
      }
      .stat-item span:first-child {
        color: #9facbd;
        font-size: 11px;
      }
      .stat-item span:last-child {
        font-weight: 800;
        font-size: 12px;
        text-align: right;
      }
      .gallery {
        display: grid;
        gap: 12px;
      }
      .gallery img {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #06090e;
      }
      .ref-section {
        margin-top: 18px;
      }
      .ref {
        padding: 9px 10px;
        background: #111824;
        border: 1px solid var(--line);
        border-radius: 9px;
        margin-top: 7px;
        font-size: 12px;
      }
      .ref strong {
        color: #7ed7ff;
      }
      .note {
        padding: 11px 12px;
        border-left: 3px solid var(--accent);
        background: #0e1823;
        color: #c1d2e2;
        border-radius: 7px;
        font-size: 12px;
        line-height: 1.5;
        margin: 15px 0;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          position: static;
          height: auto;
          padding: 15px;
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .nav {
          display: flex;
          margin: 14px 0 0;
          overflow: auto;
        }
        .side-meta {
          display: none;
        }
        main {
          padding: 20px;
        }
        .statsbar {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">NINJA SAGA <small>Talent Database</small></div>
        <div class="nav">
          <button class="active" data-section="browse">Browse Talents</button>
          <button data-section="stats">Passive Stats</button>
          <button data-section="compare">Compare</button>
        </div>
        <div class="side-meta">
          Offline-friendly static database.<br /><br /><span class="kbd">/</span> focus search
          &nbsp; <span class="kbd">Esc</span> close detail
        </div>
      </aside>
      <main>
        <div class="topbar">
          <div>
            <div class="eyebrow">Ninja Saga Online</div>
            <div class="title" id="pageTitle">Talent Browser</div>
            <div class="subtitle" id="pageSubtitle">
              Browse the collection and open any talent for a full screenshot view.
            </div>
          </div>
        </div>
        <div id="browse" class="section active">
          <div class="toolbar">
            <input
              id="search"
              class="search"
              placeholder="Search talents or passive notes…"
            /><select id="typeFilter">
              <option value="all">All talent types</option>
              <option>Extreme</option>
              <option>Secret</option></select
            ><select id="sortFilter" aria-label="Sort talents">
              <option value="default">Default order</option>
              <option value="az">A-Z</option></select
            ><button class="ghost" id="clearBtn">Clear</button>
          </div>
          <div class="statsbar" id="browseKpis"></div>
          <div class="grid" id="talentGrid"></div>
        </div>
        <div id="stats" class="section">
          <div class="toolbar">
            <input
              id="statsSearch"
              class="search"
              placeholder="Filter by talent name or stat text…"
            /><select id="statsType">
              <option value="all">All</option>
              <option>Extreme</option>
              <option>Secret</option></select
            ><select id="statsSort" aria-label="Sort passive stats">
              <option value="default">Default order</option>
              <option value="az">A-Z</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr id="statHead"></tr>
              </thead>
              <tbody id="statBody"></tbody>
            </table>
          </div>
        </div>
        <div id="compare" class="section">
          <div class="compare-head">
            <div>
              <div class="eyebrow">Side-by-side</div>
              <h2 style="margin: 4px 0 2px">Passive stat comparison</h2>
              <div class="subtitle">Select up to four talents from the browser.</div>
            </div>
            <button class="ghost" id="clearCompare">Clear</button>
          </div>
          <div id="compareArea"></div>
        </div>
      </main>
    </div>
    <div class="drawer" id="drawer">
      <div class="panel">
        <div class="panel-top">
          <div id="panelTopTitle"></div>
          <button class="close" id="closeDrawer">×</button>
        </div>
        <div class="panel-body" id="panelBody"></div>
      </div>
    </div>
    <script src="data.js"></script>
    <script>
      const D = window.NINJA_DATA;
      const talents = D.talents;
      const byName = new Map(talents.map((t) => [t.name, t]));
      let compare = [];
      const qs = (s) => document.querySelector(s),
        qsa = (s) => [...document.querySelectorAll(s)];
      const fmt = (x) => x;
      function passiveChips(t) {
        const keys = [
          'Max HP',
          'Max CP',
          'Agility',
          'Crit chance%',
          'Crit dmg%',
          'Dodge',
          'Accuracy',
          'Purify',
          'Dmg. Bonus',
          'Dmg. Reduction',
          'HP regen',
          'CP regen',
        ];
        let out = [];
        for (const k of keys) {
          const v = t.passiveStats[k]?.display;
          if (v !== undefined) out.push(`${k.replace('%', '')}: ${v}`);
        }
        return out.slice(0, 4);
      }
      function card(t) {
        return `<article class="card"><div class="thumb">${t.images[0] ? `<img loading="lazy" src="${t.images[0]}" alt="${t.name} skill screenshot">` : '<span class="dash">No screenshot</span>'}</div><div class="card-body"><div class="name-row"><div class="name">${t.name}</div><div class="badge ${t.type.toLowerCase()}">${t.type}</div></div><div class="chips">${t.emblemOnly ? '<span class="badge e">Emblem</span>' : ''}${passiveChips(
          t,
        )
          .map((x) => `<span class="chip">${x}</span>`)
          .join(
            '',
          )}</div><div class="card-actions"><button onclick="openTalent('${t.name.replaceAll("'", "\\'")}')">Details</button><button onclick="toggleCompare('${t.name.replaceAll("'", "\\'")}')">${compare.includes(t.name) ? '✓ Comparing' : 'Compare'}</button></div></div></article>`;
      }
      function renderBrowse() {
        const term = qs('#search').value.trim().toLowerCase(),
          typ = qs('#typeFilter').value,
          sort = qs('#sortFilter').value;
        const filtered = talents.filter((t) => {
          if (typ !== 'all' && t.type !== typ) return false;
          const hay = (
            t.name +
            ' ' +
            (t.aliases || []).join(' ') +
            ' ' +
            JSON.stringify(t.passiveStats)
          ).toLowerCase();
          return !term || hay.includes(term);
        });
        if (sort === 'az') {
          filtered.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }
        qs('#talentGrid').innerHTML = filtered.length
          ? filtered.map(card).join('')
          : `<div class="empty">No talents match the current filters.</div>`;
        qs('#browseKpis').innerHTML =
          `<div class="kpi"><b>${talents.length}</b><span>Total talents</span></div><div class="kpi"><b>${talents.filter((x) => x.type === 'Extreme').length}</b><span>Extreme</span></div><div class="kpi"><b>${talents.filter((x) => x.type === 'Secret').length}</b><span>Secret</span></div><div class="kpi"><b>${D.meta.screenshotCount}</b><span>Skill screenshots</span></div>`;
      }
      function displayStat(t, k) {
        const v = t.passiveStats[k];
        return v ? `<span class="num">${v.display}</span>` : `<span class="dash">—</span>`;
      }
      function renderStats() {
        const term = qs('#statsSearch').value.trim().toLowerCase(),
          typ = qs('#statsType').value,
          sort = qs('#statsSort').value;
        const filtered = talents.filter((t) => {
          if (typ !== 'all' && t.type !== typ) return false;
          return (
            !term ||
            (t.name + ' ' + (t.aliases || []).join(' ') + ' ' + JSON.stringify(t.passiveStats))
              .toLowerCase()
              .includes(term)
          );
        });
        if (sort === 'az') {
          filtered.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }));
        }
        const headers = ['Talent', 'Type', ...D.statColumns];
        qs('#statHead').innerHTML = headers.map((h) => `<th>${h}</th>`).join('');
        qs('#statBody').innerHTML =
          filtered
            .map(
              (t) =>
                `<tr><td><button class="talent-link" onclick="openTalent('${t.name.replaceAll("'", "\\'")}')">${t.name}</button></td><td>${t.type}</td>${D.statColumns.map((k) => `<td>${k === 'Other' ? `<div class="other">${t.passiveStats[k]?.display || '<span class="dash">—</span>'}</div>` : displayStat(t, k)}</td>`).join('')}</tr>`,
            )
            .join('') ||
          `<tr><td colspan="${headers.length}"><div class="empty">No matching talents.</div></td></tr>`;
      }
      function renderCompare() {
        const area = qs('#compareArea');
        if (!compare.length) {
          area.innerHTML =
            '<div class="empty">Choose talents from Browse Talents and add them here. Up to four at a time.</div>';
          return;
        }
        const cols = compare.map((n) => byName.get(n));
        const rows = ['Type', ...D.statColumns];
        let html =
          '<div class="compare-grid" style="grid-template-columns:240px repeat(' +
          cols.length +
          ',minmax(170px,1fr))">';
        html +=
          '<div class="head">Stat</div>' +
          cols
            .map(
              (t) =>
                `<div class="head"><button class="talent-link" onclick="openTalent('${t.name.replaceAll("'", "\\'")}')">${t.name}</button></div>`,
            )
            .join('');
        for (const k of rows) {
          html += `<div class="label">${k}</div>`;
          for (const t of cols) {
            const val = k === 'Type' ? t.type : t.passiveStats[k]?.display || '—';
            html += `<div class="compare-cell ${val === '—' ? 'none' : 'has'}">${val}</div>`;
          }
        }
        html += '</div>';
        area.innerHTML = html;
      }
      function toggleCompare(name) {
        if (compare.includes(name)) {
          compare = compare.filter((x) => x !== name);
        } else {
          if (compare.length >= 4) {
            alert('Comparison is limited to 4 talents. Remove one first.');
            return;
          }
          compare.push(name);
        }
        renderBrowse();
        renderCompare();
      }
      function openTalent(name) {
        const t = byName.get(name);
        if (!t) return;
        qs('#panelTopTitle').innerHTML = `<div class="name">${t.name}</div>`;
        let statRows = '';
        for (const k of D.statColumns) {
          const v = t.passiveStats[k]?.display;
          if (v !== undefined)
            statRows += `<div class="stat-item"><span>${k}</span><span>${v}</span></div>`;
        }
        qs('#panelBody').innerHTML =
          `<div class="hero-title">${t.name}</div><div class="hero-meta">${t.type}${t.emblemOnly ? ' · Emblem-only' : ''}</div><div class="note">Passive-stat view only. Active skills that temporarily modify stats are not included here. The screenshots below remain the source material for the individual skillset.</div><div class="detail-stats">${statRows || '<div class="dash">No passive stats recorded.</div>'}</div><div class="ref-section"><div class="eyebrow">Skill screenshots (${t.images.length})</div><div class="gallery">${t.images.map((src, i) => `<img loading="lazy" src="${src}" alt="${t.name} screenshot ${i + 1}">`).join('')}</div></div>`;
        qs('#drawer').classList.add('open');
      }
      function switchSection(id) {
        qsa('.section').forEach((x) => x.classList.toggle('active', x.id === id));
        qsa('.nav button').forEach((x) => x.classList.toggle('active', x.dataset.section === id));
        const titles = {
          browse: [
            'Talent Browser',
            'Browse the collection and open any talent for a full screenshot view.',
          ],
          stats: ['Passive Stats', 'A table for exact stat comparison of each talent.'],
          compare: ['Compare', 'Put up to four talents side by side.'],
        };
        qs('#pageTitle').textContent = titles[id][0];
        qs('#pageSubtitle').textContent = titles[id][1];
        if (id === 'browse') renderBrowse();
        if (id === 'stats') renderStats();
        if (id === 'compare') renderCompare();
      }
      qsa('.nav button').forEach((b) =>
        b.addEventListener('click', () => switchSection(b.dataset.section)),
      );
      ['#search', '#typeFilter', '#sortFilter'].forEach((s) =>
        qs(s).addEventListener('input', renderBrowse),
      );
      ['#statsSearch', '#statsType', '#statsSort'].forEach((s) =>
        qs(s).addEventListener('input', renderStats),
      );
      qs('#clearBtn').addEventListener('click', () => {
        qs('#search').value = '';
        qs('#typeFilter').value = 'all';
        qs('#sortFilter').value = 'default';
        renderBrowse();
      });
      qs('#clearCompare').addEventListener('click', () => {
        compare = [];
        renderBrowse();
        renderCompare();
      });
      qs('#closeDrawer').addEventListener('click', () => qs('#drawer').classList.remove('open'));
      qs('#drawer').addEventListener('click', (e) => {
        if (e.target.id === 'drawer') qs('#drawer').classList.remove('open');
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') qs('#drawer').classList.remove('open');
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          qs('#search').focus();
        }
      });
      renderBrowse();
      renderStats();
    </script>
  </body>
</html>
